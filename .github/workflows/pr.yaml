name: PR

on:
    pull_request:

jobs:
    common:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Check PR Title
              env:
                  TITLE: ${{ github.event.pull_request.title }}
              run: |
                  REGEX='^(fix|feat|build|chore|ci|docs|style|refactor|perf|test):\s.+$'

                  echo "PR title: $TITLE"

                  if ! [[ "$TITLE" =~ $REGEX ]]; then
                    echo "::error::PR title does not match required format."
                    echo "Expected: feat(scope): description"
                    exit 1
                  fi

    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/

            - name: Install Packages
              run: npm ci --no-progress --ignore-scripts

            - name: Run Tests
              run: npm test
